[package]
name = "calcbj-wasm"
version = "0.1.0"
edition = "2024"
description = "WebAssembly interface of the CalcBJ engine for the web app (web/app)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calcbj-engine = { path = "../engine", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: decimals such as a 20.2% penetration reach the engine exactly as the C# app passes them.
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
