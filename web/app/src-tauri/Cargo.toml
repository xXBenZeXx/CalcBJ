[package]
name = "calcbj-desktop"
version = "0.1.2"
description = "CalcBJ as a desktop app for Windows and Mac: the web interface and engine in a window of their own"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
